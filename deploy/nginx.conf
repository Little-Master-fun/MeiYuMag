# Caddy overwrites X-Real-IP; this listener is published only on loopback.
limit_req_zone $http_x_real_ip zone=auth_limit:10m rate=10r/m;
limit_req_zone $http_x_real_ip zone=api_limit:10m rate=10r/s;
server {
    listen 8080;
    server_name mymag.littlemaster.fun;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 160m;
    client_body_timeout 60s;
    limit_req_status 429;

    location ~ /\. { return 404; }
    location ~ ^/(docs|redoc|openapi\.json|uploads|back-end|src-tauri)(/|$) { return 404; }
    location ~ ^/api/v1/(auth/(login|register|register/sms)|sdu-auth/.*)$ {
        limit_req zone=auth_limit burst=10 nodelay;
        include /etc/nginx/conf.d/proxy-api.inc;
    }
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        include /etc/nginx/conf.d/proxy-api.inc;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /models/ {
        expires 1d;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
