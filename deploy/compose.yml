name: meiyu
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: meiyu
      POSTGRES_DB: meiyu_system
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes: [database:/var/lib/postgresql/data]
    shm_size: 128mb
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U meiyu -d meiyu_system']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  api:
    image: meiyu-api:local
    build: ../back-end
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    volumes:
      - '${MEIYU_SECRETS_DIR:-/opt/meiyu/secrets}/backend.env:/app/.env:ro'
      - uploads:/app/uploads
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging: *logging
  web:
    image: nginxinc/nginx-unprivileged:stable-alpine
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    ports: ['127.0.0.1:18080:8080']
    volumes:
      - ../front-end/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy-api.inc:/etc/nginx/conf.d/proxy-api.inc:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    logging: *logging
secrets:
  db_password:
    file: '${MEIYU_SECRETS_DIR:-/opt/meiyu/secrets}/db_password'
volumes:
  database:
  uploads:
